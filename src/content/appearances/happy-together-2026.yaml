name: "해피투게더 - 혼자가 아니어서 좋아"
summary: "유재석·장항준·윤종신이 진행하는 KBS 2TV 음악 오디션. 2026년 10월 9일 방송된 11회(파이널 스테이지 in 한강)에서 원이와 미나미가 데뷔 후 처음으로 공중파 예능 스페셜 MC를 맡았고, 리센느는 축하 무대도 꾸밀 예정이라고 보도됐다. 방송 전 예고 기사 기준이라 실제 방송 내용은 확인필요."
