name: 카사베르디
summary: 이탈리아 비니거 브랜드. 2026년 6월 25일 리센느를 모델로 한 첫 TV CF가 공개됐다(시작일은 최초 보도 기준). 이후 같은 모델을 쓰는 나랑드사이다와 '리센느 유니버스' 공동 프로젝트를 진행 중이다. 2026년 7월 30일 보도 기준으로 콘텐츠를 순차 공개하고 있다.
