name: 김씨네과일
summary: 리센느와 함께 만든 한정판 '야호 티셔츠' 5종을 크림(KREAM) 단독으로 판매했다. 거제·치바·수원·경주·고양을 주제로 멤버들이 직접 그린 그림을 담았다. 발매일은 7월 9일이며 연도는 페이지에 없고, 2026년 7월 13일 보도에서 '앞서 선보인' 협업으로 언급돼 2026년으로 봤다.
