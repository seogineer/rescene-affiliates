name: 나랑드사이다 (동아오츠카)
summary: 동아오츠카의 제로 사이다 브랜드. 2026년 7월 21일 리센느를 브랜드 모델로 발탁했다고 밝혔다(시작일은 발표일 기준). 이후 같은 모델을 쓰는 카사베르디와 '리센느 유니버스' 공동 프로젝트를 진행 중이다. 2026년 7월 30일 보도 기준으로 콘텐츠를 순차 공개하고 있다.
