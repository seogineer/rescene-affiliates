name: CU
summary: 2026년 7월 리센느를 브랜드 모델로 선정하고 '일상의 모든 Scene(씬), CU' 캠페인을 진행 중이다. 협업 상품을 출시하고, 점포에서 멤버 음성 할인 안내와 쿠폰 홍보를 한다. 9월 17일부터는 자체 베이커리 브랜드 BAKE405로 멤버별 협업 빵 5종을 순차 출시했고, 상품마다 한정판 포토카드 27종 중 1장이 무작위로 들어 있다.
