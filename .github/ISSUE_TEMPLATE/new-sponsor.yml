name: 후원 기업 제보
description: 목록에 없는 리센느 후원 기업을 제보합니다
title: "[기업] "
labels: ["제보"]
body:
  - type: input
    id: name
    attributes: { label: 기업명 }
    validations: { required: true }
  - type: dropdown
    id: type
    attributes:
      label: 후원 형태
      options: [광고모델, 앰버서더, 협찬, 콜라보, 스폰서십, 기타]
    validations: { required: true }
  - type: input
    id: period
    attributes: { label: 기간, description: "예: 2025-03 ~ 진행중" }
  - type: textarea
    id: source
    attributes:
      label: 출처 링크 (필수)
      description: 기사, 공식 SNS 게시물 등 근거가 되는 링크를 적어주세요.
    validations: { required: true }
  - type: textarea
    id: note
    attributes: { label: 기타 설명 }
