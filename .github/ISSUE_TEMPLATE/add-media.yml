name: 이미지·영상 추가 제보
description: 기업이 올린 리센느 관련 게시물 링크를 제보합니다
title: "[미디어] "
labels: ["제보"]
body:
  - type: input
    id: company
    attributes: { label: 기업명 }
    validations: { required: true }
  - type: input
    id: url
    attributes:
      label: 게시물 링크
      description: 이미지 파일 주소가 아니라 게시물(유튜브, 인스타그램, X 등) 주소를 적어주세요.
    validations: { required: true }
  - type: dropdown
    id: kind
    attributes: { label: 종류, options: [영상, 이미지] }
    validations: { required: true }
  - type: input
    id: date
    attributes: { label: 게시 날짜 }
